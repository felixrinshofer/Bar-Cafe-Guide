<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Bar Café Guide</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#eef1f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BCG" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header id="app-header">
    <h1 class="app-logo-wrap">
      <img id="app-logo" class="app-logo" src="./icons/logo.svg" alt="Bar Café Guide" />
    </h1>
    <div class="search-row">
      <input id="search-input" type="search" placeholder="Suche nach Name, Kategorie, Viertel…" />
      <button id="locate-btn">📍 In meiner Nähe</button>
    </div>

    <div class="control-row">
      <div id="view-toggle">
        <button class="chip chip--active" data-view="list" type="button">Liste</button>
        <button class="chip" data-view="map" type="button">Karte</button>
      </div>
      <select id="sort-select">
        <option value="name">Name A-Z</option>
        <option value="distance">Entfernung</option>
        <option value="price">Preis</option>
        <option value="neighborhood">Stadtteil</option>
      </select>
      <button id="filter-toggle" type="button" aria-expanded="false">Filter ▾</button>
    </div>

    <p id="result-count"></p>

    <div id="filter-panel" hidden>
      <div class="filter-group">
        <p class="filter-group__label">Typ</p>
        <div id="type-chips" class="chip-row"></div>
      </div>
      <div class="filter-group">
        <p class="filter-group__label">Kategorie</p>
        <div id="category-chips" class="chip-row"></div>
      </div>
      <div class="filter-group">
        <p class="filter-group__label">Preisklasse</p>
        <div id="price-chips" class="chip-row"></div>
      </div>
      <div class="filter-group">
        <p class="filter-group__label">Vibe</p>
        <div id="vibe-chips" class="chip-row"></div>
      </div>
      <button id="reset-filters" type="button">Filter zurücksetzen</button>
    </div>
  </header>

  <main>
    <div id="type-overview" class="type-overview"></div>
    <div id="venue-list"></div>
    <div id="map" hidden></div>
    <div id="empty-state-global" class="empty-state" hidden>
      <span class="empty-state__icon">🍸</span>
      <p class="empty-state__title">Noch keine Locations</p>
      <p class="empty-state__subtitle">Tipp unten rechts auf „+“, um deine erste Bar oder dein erstes Café hinzuzufügen.</p>
    </div>
  </main>

  <button id="fab-add" type="button" aria-label="Bar oder Café hinzufügen">+</button>

  <div id="detail-sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet__handle"></div>
      <button class="sheet__close" id="detail-close" type="button" aria-label="Schließen">✕</button>
      <div id="detail-photos" class="detail-photos"></div>
      <div class="sheet__body">
        <div class="detail-title-row">
          <h2 id="detail-name"></h2>
          <button class="fav-btn" id="detail-fav" type="button" aria-label="Favorit">★</button>
        </div>
        <div id="detail-info-tiles" class="info-tiles"></div>
        <div id="detail-vibes" class="venue-card__vibes"></div>
        <p id="detail-description" class="detail-description"></p>
        <div class="detail-footer-actions">
          <button id="detail-edit" type="button" class="text-action">✎ Bearbeiten</button>
          <button id="detail-delete" type="button" class="text-action text-action--danger">Löschen</button>
        </div>
      </div>
    </div>
  </div>

  <div id="form-sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet__handle"></div>
      <button class="sheet__close" id="form-close" type="button" aria-label="Schließen">✕</button>
      <div class="sheet__body">
        <h2 id="form-title">Neue Location</h2>
        <form id="venue-form">
          <label class="field-label" for="f-name">Name</label>
          <input id="f-name" type="text" required placeholder="z.B. Goldene Bar" />

          <p class="field-label">Typ</p>
          <div id="f-type" class="segmented"></div>

          <label class="field-label" for="f-category">Kategorie</label>
          <input id="f-category" type="text" list="category-suggestions" placeholder="z.B. Cocktailbar" />
          <datalist id="category-suggestions"></datalist>

          <p class="field-label">Preisklasse</p>
          <div id="f-price" class="segmented"></div>

          <p class="field-label">Vibes</p>
          <div id="f-vibes" class="chip-row chip-row--wrap"></div>
          <div class="inline-add">
            <input id="f-vibe-input" type="text" placeholder="Eigenen Vibe hinzufügen…" />
            <button id="f-vibe-add" type="button" class="btn btn--small">+</button>
          </div>

          <label class="field-label" for="f-neighborhood">Stadtteil</label>
          <input id="f-neighborhood" type="text" placeholder="z.B. Glockenbachviertel" />

          <label class="field-label" for="f-maplink">Maps-Link (optional)</label>
          <input id="f-maplink" type="text" inputmode="url" placeholder="Link aus Apple/Google Maps einfügen" />
          <p id="f-maplink-status" class="field-hint"></p>

          <label class="field-label" for="f-address">Adresse</label>
          <input id="f-address" type="text" placeholder="Straße, PLZ Ort" />

          <p class="field-label">Standort</p>
          <button id="f-locate" type="button" class="btn btn--secondary">📍 Aktuellen Standort verwenden</button>
          <p id="f-location-status" class="field-hint"></p>

          <label class="field-label" for="f-description">Meine Notizen</label>
          <textarea id="f-description" rows="4" placeholder="Was macht diesen Ort besonders? Lieblingsdrink, Erinnerung, Tipp…"></textarea>

          <p class="field-label">Fotos</p>
          <div id="f-photos" class="photo-strip"></div>
          <input id="f-photo-input" type="file" accept="image/*" multiple hidden />
          <button id="f-photo-add" type="button" class="btn btn--secondary">📷 Foto hinzufügen</button>

          <p id="f-error" class="field-error" hidden></p>
          <div class="sheet__actions">
            <button type="button" id="form-cancel" class="btn btn--secondary">Abbrechen</button>
            <button type="submit" class="btn btn--primary">Speichern</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
